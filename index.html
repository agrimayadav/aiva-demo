<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Smile desk dashboard</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="desk.css">
</head>
<body>
<main>
  <header class="hero">
    <div>
      <p class="eyebrow">Happy Smile desk dashboard</p>
      <h1 id="headline">7 callbacks waiting</h1>
      <p id="split" class="split"></p>
    </div>
    <button id="openRules" class="btn ghost">Handoff rules</button>
  </header>

  <section>
    <h2>Needs a callback</h2>
    <div id="queue" class="list"></div>
  </section>

  <section>
    <h2>Handled by AIVA</h2>
    <div id="handled" class="list"></div>
  </section>

  <p class="foot">Fictional demo data · <a href="#" id="reset">Reset demo</a></p>
</main>

<div id="scrim" class="scrim" hidden></div>
<aside id="rules" class="sheet" hidden aria-label="Handoff rules">
  <div class="sheet-head">
    <h2>Handoff rules</h2>
    <button id="closeRules" class="icon" aria-label="Close">✕</button>
  </div>
  <p class="muted">AIVA hands a call to the front desk when any rule matches. New rules go live after the front-desk lead approves them.</p>
  <ul id="ruleList" class="rules"></ul>
  <form id="ruleForm" class="add">
    <label for="ruleText">Add a rule</label>
    <input id="ruleText" placeholder="e.g. Caller asks about insurance" autocomplete="off" required>
    <div class="row">
      <select id="rulePri" aria-label="Priority">
        <option value="P0">P0 · call within 15 min</option>
        <option value="P1" selected>P1 · call within 1 hr</option>
        <option value="P2">P2 · call today</option>
      </select>
      <button class="btn primary" type="submit">Save rule</button>
    </div>
  </form>
</aside>

<div id="toast" class="toast" hidden><span id="toastMsg"></span><button id="undo">Undo</button></div>
<script src="desk.js"></script>
</body>
</html>
