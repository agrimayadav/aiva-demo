<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Call HappySmile</title>
<link rel="icon" href="data:,">
<style>
  *{box-sizing:border-box}[hidden]{display:none!important}
  html,body{height:100%;margin:0}
  body{font-family:Segoe UI,system-ui,-apple-system,Roboto,sans-serif;background:radial-gradient(circle at 50% 40%,#e9f7f7,#f7fafb 60%);color:#1d2939;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
  #call{width:190px;height:190px;border-radius:50%;border:0;cursor:pointer;color:#fff;font:600 20px/1.3 inherit;
    background:#0e7c86;box-shadow:0 12px 30px rgba(14,124,134,.35);transition:background .2s,transform .1s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  #call:active{transform:scale(.97)}
  #call .ic{font-size:44px;line-height:1}
  #call.live{background:#d92d20;box-shadow:0 12px 30px rgba(217,45,32,.35)}
  #call.speaking{animation:ring 1.6s ease-out infinite}
  #call.listening{animation:ringRed 1.6s ease-out infinite}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(14,124,134,.45)}100%{box-shadow:0 0 0 34px rgba(14,124,134,0)}}
  @keyframes ringRed{0%{box-shadow:0 0 0 0 rgba(217,45,32,.4)}100%{box-shadow:0 0 0 34px rgba(217,45,32,0)}}
  #status{min-height:22px;font-size:15px;color:#475467;text-align:center;max-width:90vw}
  #typed{display:flex;gap:6px}#typed input{width:300px;max-width:70vw;padding:10px;border:1px solid #d0d5dd;border-radius:8px;font-size:15px}
  #typed button{padding:10px 14px;border:0;border-radius:8px;background:#0e7c86;color:#fff;font-weight:600;cursor:pointer}
  footer{position:fixed;bottom:12px;font-size:12px;color:#98a2b3;text-align:center;padding:0 12px}footer a{color:#0e7c86}
</style>
</head>
<body>
  <button id="call"><span class="ic">📞</span><span id="label">Call HappySmile</span></button>
  <div id="status"></div>
  <div id="typed" hidden><input id="txt" placeholder="Voice not available here. Type your reply"><button id="send">Send</button></div>
  <footer>Fictional demo · use Microsoft Edge with headphones (natural voice + you can interrupt) · allow the microphone · <a href="dashboard.html">Front-desk view →</a><br><span id="voiceName"></span></footer>
<script src="engine.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
